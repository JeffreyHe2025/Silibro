version: 1
frontend:
  phases:
    build:
      commands:
        # Assemble a clean publish folder with ONLY the frontend files.
        # backend/, *.sql, README, etc. are deliberately left out so Amplify
        # never serves them.
        - rm -rf dist && mkdir dist
        - cp index.html app.js styles.css config.js dist/
        # Extra pages served at /models/ and /leaderboard/ (folder + index.html).
        - cp -R models leaderboard admin dist/
        # If you add frontend assets later (e.g. favicon.ico, images/),
        # add them to the lines above so they get published.
  artifacts:
    # Publish only the dist/ folder — index.html is at "/".
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []
