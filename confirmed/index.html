<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Confirmed — Silebro</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f5f6f8; color: #1c1e21;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 40px 36px;
      max-width: 440px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
    .check { width: 64px; height: 64px; border-radius: 50%; background: #f0fdf4; border: 2px solid #bbf7d0;
      display: flex; align-items: center; justify-content: center; font-size: 34px; margin: 0 auto 20px; }
    h1 { font-size: 22px; margin: 0 0 10px; color: #166534; }
    p { color: #4b5563; font-size: 15px; line-height: 1.5; margin: 0 0 26px; }
    .btn { display: inline-block; background: #2563eb; color: #fff; text-decoration: none;
      padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 600; }
    .btn:hover { background: #1d4ed8; }
    .err h1 { color: #b91c1c; }
    .err .check { background: #fef2f2; border-color: #fecaca; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="check">✅</div>
    <h1>Email confirmed!</h1>
    <p>Your email is verified. Go back to Silebro and sign in to get started.</p>
    <a class="btn" href="/">Go to Silebro →</a>
  </div>

  <script>
    // Supabase puts an error in the URL hash if the link is expired/invalid.
    try {
      var h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
      if (h.get("error")) {
        var card = document.getElementById("card");
        card.className = "card err";
        var desc = h.get("error_description") || "This confirmation link is invalid or has expired.";
        card.innerHTML =
          '<div class="check">⚠️</div>' +
          '<h1>Link problem</h1>' +
          '<p>' + desc.replace(/\+/g, " ") + ' Please sign in — if needed, request a new confirmation email.</p>' +
          '<a class="btn" href="/">Go to Silebro →</a>';
      }
    } catch (e) {}
  </script>
</body>
</html>
